# Packaging configuration (electron-builder, MIT). Build the Windows installer on Windows:
#   npm run dist:win     → release/Blazma-Cyber-<version>-x64-setup.exe (NSIS, per-user, no elevation)
#   npm run dist:dir     → unpacked app for the current OS (quick verification)
# Code signing is configured only through environment variables (CSC_LINK / CSC_KEY_PASSWORD or
# WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD). Never commit certificates or passwords.
appId: com.blazmacyber.workbench
productName: Blazma Cyber
copyright: Copyright © 2026 mr-kateba
artifactName: Blazma-Cyber-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: build

# Everything is bundled by esbuild/Vite: the app needs only dist/ and package.json at runtime.
files:
  - dist/**/*
  - "!**/*.map"
  - package.json
  - LICENSE
asar: true
# Rule packs (text, vendored in the repo) ship on every platform.
extraResources:
  - from: engines/rules
    to: rules
  # License texts of data and code compiled into the app (ATT&CK table, WhatsMyName site list, OUI table, jsQR).
  - from: engines/licenses/mitre-attack.txt
    to: licenses/mitre-attack.txt
  - from: engines/licenses/whatsmyname.txt
    to: licenses/whatsmyname.txt
  - from: engines/licenses/oui-data.txt
    to: licenses/oui-data.txt
  - from: engines/licenses/jsqr.txt
    to: licenses/jsqr.txt
  # Window/taskbar icon (the .exe carries it too).
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
electronLanguages:
  - en-US
  - ar

# Electron fuses flipped at package time (hardening against running the signed binary as a
# generic Node runtime or loading modified app code).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # Least privilege: the app always starts unelevated.
  requestedExecutionLevel: asInvoker
  # Engines fetched and SHA-256-verified by scripts/fetch-engines.mjs (see engines.lock.json).
  extraResources:
    - from: build/engines
      to: engines
      filter:
        - "**/*"
        - "!*.zip"
        - "!**/.verified"

nsis:
  artifactName: Blazma-Cyber-${version}-${arch}-setup.${ext}
  oneClick: false
  # The installer shows the GPL-3.0 license before installing.
  license: LICENSE
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Blazma Cyber
  # User data (settings, cases, quarantine) is kept on uninstall; the Privacy Center clears it.
  deleteAppDataOnUninstall: false
  unicode: true
  multiLanguageInstaller: true
  installerLanguages:
    - en_US
    - ar_SA

linux:
  target: dir
  icon: build/icon.png
  category: Utility

# No auto-update and no publishing: Blazma never phones home.
publish: null
