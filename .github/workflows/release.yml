# Manually triggered release: builds the Windows installer on a clean runner, runs the checks and the
# packaged-app smoke test, publishes SHA-256 checksums and a GitHub build-provenance attestation
# (Sigstore), then creates a GitHub Release with the installer.
#
# Code signing (optional): add repository secrets WIN_CSC_LINK (base64 of a .pfx, or its URL) and
# WIN_CSC_KEY_PASSWORD. When they are absent the installer is built unsigned. Never commit them.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0-beta.1'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write      # create the release and its tag
      id-token: write      # Sigstore OIDC for the attestation
      attestations: write  # store the attestation
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw 'Invalid tag. Expected e.g. v0.1.0-beta.1' }
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win
      - name: Packaged app smoke test
        run: node scripts/package-smoke.mjs "release\win-unpacked\BLAZMA CYBER.exe"
      - name: Portable zip + smoke test in portable mode
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          node scripts/make-portable.mjs release/win-unpacked "release/BLAZMA-CYBER-$v-x64-portable.zip"
          node scripts/package-smoke.mjs "release\win-unpacked\BLAZMA CYBER.exe" --portable
      - name: Checksums
        run: |
          $files = @(Get-ChildItem release\*-setup.exe | Select-Object -First 1) + @(Get-ChildItem release\*-portable.zip | Select-Object -First 1)
          $files | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -LiteralPath release\SHA256SUMS.txt -Encoding ascii
          Get-Content release\SHA256SUMS.txt
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*-setup.exe
            release/*-portable.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $exe = (Get-ChildItem release\*-setup.exe | Select-Object -First 1).FullName
          $zip = (Get-ChildItem release\*-portable.zip | Select-Object -First 1).FullName
          $notes = Get-Content -LiteralPath .github\release-notes.md -Raw
          $notes += "`n**SHA-256:**`n" + ((Get-Content release\SHA256SUMS.txt | ForEach-Object { "- ``$_``" }) -join "`n") + "`n"
          Set-Content -LiteralPath release\notes.md -Value $notes -Encoding utf8
          $ghArgs = @('release', 'create', $env:TAG, $exe, $zip, 'release\SHA256SUMS.txt', '--target', $env:GITHUB_SHA, '--title', "BLAZMA CYBER $env:TAG", '--notes-file', 'release\notes.md')
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh @ghArgs
